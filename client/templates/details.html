<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Szczegóły Wydarzenia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <a href="/" class="btn btn-secondary mb-3">&laquo; Powrót</a>
    
    <h2>Edycja Wydarzenia #{{ event.id }}</h2>
    
    <form action="/update/{{ event.id }}" method="post" class="card p-4">
        <div class="row mb-3">
            <div class="col">
                <label>Nazwa</label>
                <input type="text" name="name" class="form-control" value="{{ event.name }}" required>
            </div>
            <div class="col">
                <label>Typ</label>
                <input type="text" name="type" class="form-control" value="{{ event.type }}" required>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col">
                <label>Data</label>
                <input type="date" name="date" class="form-control" value="{{ event.date }}" required>
            </div>
            <div class="col">
                <label>Tydzień</label>
                <input type="number" name="week" class="form-control" value="{{ event.week }}" required>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col">
                <label>Miesiąc</label>
                <input type="number" name="month" class="form-control" value="{{ event.month }}" required>
            </div>
            <div class="col">
                <label>Rok</label>
                <input type="number" name="year" class="form-control" value="{{ event.year }}" required>
            </div>
        </div>
        <div class="mb-3">
            <label>Opis</label>
            <textarea name="description" class="form-control" rows="3" required>{{ event.description }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Zapisz Zmiany</button>
    </form>
</body>
</html>
